<!doctype html>
<html lang="en">

<head>
  <title>Vonage Video Sample App 🎥</title>
  <meta name="viewport" content="width=device-width">
  <script src="https://unpkg.com/@vonage/client-sdk-video@latest/dist/js/opentok.js"></script>
  <script src="/static/app.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <div id="loginContainer">
    <h2>Join video session</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <label for="nameInput">Your name:</label><br />
      <input id="nameInput" name="name" type="text" placeholder="Enter your name" required /><br /><br />

      <label>
        <input type="checkbox" id="presenterCheckbox" name="presenter" />
        Join as Presenter
      </label><br /><br />

      <button type="submit">Join session</button>
    </form>
  </div>

  <div id="sessionContainer" style="display:none;">
    <div id="subscriber"></div>
    <div id="publisher"></div>

    <!-- Captions display -->
    <div id="captionsBox" style="display:none;">
      <span id="captionsText"></span>
    </div>

    <!-- Chat display -->
    <div id="chat">
      <div id="messages"></div>
      <form id="chatForm" onsubmit="sendChat(event)">
        <input id="chatInput" type="text" placeholder="Type a message ..." required />
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Captioning Controls -->
    <div id="captionControls">
      <button id="captionsStart">Start closed captioning</button>
      <button id="captionsStop" style="display:none;">Stop closed captioning</button>
    </div>
    
    <!-- Muting controls -->
    <div id="mutingControls">
      <div class="muteWrapper">
        <button id="muteSpecificStream">Mute ▾</button>
        <div class="muteDropdown" id="muteDropdown">
          <ul id="streamList">
            <li><em>No streams available</em></li>
          </ul>
        </div>
      </div>

      <div class="muteWrapper">
        <button id="removeParticipant">Remove ▾</button>
        <div class="muteDropdown" id="removeDropdown">
          <ul id="removeStreamList">
            <li><em>No participants</em></li>
          </ul>
        </div>
      </div>
    </div>
    
    <div id="muteStatusPanel">
      <h4>Participant mute status</h4>
      <ul id="muteStatusList"></ul>
    </div>



    <!-- Archive Controls -->
    <div id="archiveControls">
      <button id="archiveStart">Start recording</button>
      <button id="archiveStop" style="display:none;">Stop recording</button>
      <span id="archiveLink"></span>
    </div>

  </div>

</body>

</html>
